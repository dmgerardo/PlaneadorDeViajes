<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c67139" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1815" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planeador">
<title>Planeador de Viajes</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/estilos.css?v=19">
</head>
<body>
  <a href="historial.html" class="version-badge version-badge-flotante" id="badge-version"></a>
  <div class="contenedor" style="max-width:480px;">
    <h1 style="text-align:center;margin-top:40px;">✈️ Planeador de Viajes</h1>

    <!-- Pantalla de login -->
    <div id="pantalla-login" class="tarjeta">
      <h2>Iniciar sesión</h2>
      <p style="font-size:13px;color:var(--color-texto-suave)">
        Si tu nombre no existe todavía, se crea tu cuenta con la contraseña que escribas.
      </p>
      <p id="aviso-invitacion" class="oculto" style="font-size:13px;color:var(--color-primario);">
        Al entrar te unirás automáticamente al viaje de la liga que abriste.
      </p>
      <label for="campo-nombre">Nombre</label>
      <input id="campo-nombre" type="text" autocomplete="username" placeholder="Tu nombre">
      <label for="campo-contrasena">Contraseña</label>
      <input id="campo-contrasena" type="password" autocomplete="current-password" placeholder="Tu contraseña">
      <div class="error" id="error-login"></div>
      <div class="fila-botones">
        <button id="btn-entrar" style="width:100%">Entrar</button>
      </div>
    </div>

    <!-- Pantalla de viajes (oculta hasta iniciar sesión) -->
    <div id="pantalla-viajes" class="oculto">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2 id="saludo"></h2>
        <div class="fila-botones" style="margin:0;">
          <button class="texto" id="btn-mi-contrasena">🔑 Contraseña</button>
          <button class="texto" id="btn-salir">Salir</button>
        </div>
      </div>

      <div class="tarjeta">
        <h3>Mis viajes</h3>
        <div id="lista-viajes"><p style="color:var(--color-texto-suave)">Sin viajes todavía.</p></div>
      </div>

      <div class="fila-botones">
        <button id="btn-crear-viaje">+ Crear viaje</button>
        <button class="secundario" id="btn-unirse-viaje">Unirme con clave</button>
      </div>
      <p style="text-align:center;margin-top:20px;"><a href="historial.html" style="font-size:12px;color:var(--color-texto-suave);">Historial de cambios</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/app-version.js?v=19"></script>
  <script src="js/version.js?v=19"></script>
  <script src="js/firebase-config.js?v=19"></script>
  <script src="js/render-utils.js?v=19"></script>
  <script src="js/db.js?v=19"></script>
  <script src="js/auth.js?v=19"></script>
  <script src="js/vista-admin-viajes.js?v=19"></script>
</body>
</html>
