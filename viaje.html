<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c67139" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1815" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<script src="js/tema.js?v=55"></script>
<title>Viaje — Planeador Familiar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/estilos.css?v=55">
</head>
<body>
  <div id="nav-viaje">
    <div class="fila-superior">
      <button class="texto" id="btn-volver" style="flex:0 0 auto;">← Viajes</button>
      <div class="grupo-switch" id="grupo-switch">
        <button type="button" data-grupo="viaje">En el viaje</button>
        <button type="button" data-grupo="planeacion">Planeación</button>
      </div>
      <button type="button" class="texto btn-tema" id="btn-tema" style="flex:0 0 auto;"></button>
      <a href="historial.html" class="version-badge" id="badge-version" style="align-self:center;flex:0 0 auto;"></a>
    </div>
    <div class="tabs scroll-fade-x" id="tabs-viaje"></div>
  </div>

  <div class="contenedor" id="contenido-vista">
    <p style="text-align:center;color:var(--color-texto-suave)">Cargando…</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/app-version.js?v=55"></script>
  <script src="js/version.js?v=55"></script>
  <script src="js/firebase-config.js?v=55"></script>
  <script src="js/render-utils.js?v=55"></script>
  <script src="js/iconos.js?v=55"></script>
  <script src="js/db.js?v=55"></script>
  <script src="js/auth.js?v=55"></script>
  <script src="js/catalogo-ciudades.js?v=55"></script>
  <script src="js/vista-info.js?v=55"></script>
  <script src="js/vista-ciudades.js?v=55"></script>
  <script src="js/vista-calendario.js?v=55"></script>
  <script src="js/vista-ruta.js?v=55"></script>
  <script src="js/vista-logistica.js?v=55"></script>
  <script src="js/vista-lugares.js?v=55"></script>
  <script src="js/vista-checklist.js?v=55"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const tripId = params.get("trip");
    const contenido = document.getElementById("contenido-vista");
    let sesionActual = null;
    let limpiarVistaActual = null;
    let grupoActual = "viaje";

    // Sin conexión no hay forma de volver a la lista de viajes: index.html
    // necesita descargar la lista desde Firebase (usa .get(), no caché como
    // escuchar()) y se queda sin nada que mostrar — el usuario perdería el
    // único camino de vuelta a este viaje ya guardado. Se deshabilita el
    // botón mientras estemos offline, y se reactiva solo al recuperar señal.
    const btnVolver = document.getElementById("btn-volver");
    function actualizarBtnVolver() {
      btnVolver.disabled = !navigator.onLine;
      btnVolver.title = navigator.onLine ? "" : "Sin conexión: no se puede volver a la lista de viajes hasta reconectar.";
    }
    actualizarBtnVolver();
    window.addEventListener("online", actualizarBtnVolver);
    window.addEventListener("offline", actualizarBtnVolver);

    btnVolver.addEventListener("click", () => {
      if (!navigator.onLine) return;
      // volver=1 le indica a index.html que esta navegación es explícita
      // ("quiero ver/cambiar de viaje"), para que no te regrese
      // automáticamente aquí mismo si solo tienes un viaje registrado.
      window.location.href = "index.html?volver=1";
    });

    document.getElementById("btn-tema").addEventListener("click", alternarTema);
    actualizarBotonTema();

    // Cada grupo del switcher tiene sus propios tabs; "viaje" es lo que se
    // usa día a día en el destino, "planeacion" es lo que se captura sobre
    // todo antes de salir (y se ajusta poco durante el viaje).
    const grupos = {
      viaje: [
        { id: "agenda", label: "Agenda", icono: "calendar", montar: montarVistaAgendaCalendario },
        { id: "checklist", label: "Checklist", icono: "clipboard-list", montar: montarVistaChecklist }
      ],
      planeacion: [
        { id: "info", label: "Info", icono: "info", montar: montarVistaInfo },
        { id: "ciudades", label: "Ciudades", icono: "map", montar: montarVistaCiudades },
        { id: "ruta", label: "Ruta", icono: "route", montar: montarVistaRuta },
        { id: "logistica", label: "Logística", icono: "briefcase", montar: montarVistaLogistica },
        { id: "lugares", label: "Lugares", icono: "map-pin", montar: montarVistaLugares }
      ]
    };

    function vistaPorId(id) {
      for (const grupo of Object.values(grupos)) {
        const encontrada = grupo.find(v => v.id === id);
        if (encontrada) return encontrada;
      }
      return null;
    }

    function grupoDeVista(id) {
      for (const [nombreGrupo, tabs] of Object.entries(grupos)) {
        if (tabs.some(v => v.id === id)) return nombreGrupo;
      }
      return "viaje";
    }

    function pintarTabsDelGrupo(nombreGrupo, idActivo) {
      const tabsEl = document.getElementById("tabs-viaje");
      limpiar(tabsEl);
      grupos[nombreGrupo].forEach(v => {
        const btn = document.createElement("button");
        btn.dataset.vista = v.id;
        // Solo icono, sin texto — el nombre de la pestaña queda como
        // aria-label/title (accesibilidad y tooltip en escritorio) en vez de
        // visible, y cada vista trae su propio título al entrar (ver
        // encabezados h2 de cada montarVista*).
        btn.setAttribute("aria-label", v.label);
        btn.title = v.label;
        btn.innerHTML = icono(v.icono, 20);
        btn.classList.toggle("activo", v.id === idActivo);
        btn.addEventListener("click", () => cambiarVista(v.id));
        tabsEl.appendChild(btn);
      });
      document.querySelectorAll("#grupo-switch button").forEach(b => {
        b.classList.toggle("activo", b.dataset.grupo === nombreGrupo);
      });
    }

    async function cambiarVista(id) {
      const vista = vistaPorId(id);
      if (!vista) return;
      grupoActual = grupoDeVista(id);
      pintarTabsDelGrupo(grupoActual, id);
      if (limpiarVistaActual) { limpiarVistaActual(); limpiarVistaActual = null; }
      limpiar(contenido);
      limpiarVistaActual = await vista.montar(contenido, tripId, sesionActual);
    }

    document.querySelectorAll("#grupo-switch button").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.grupo === grupoActual) return;
        cambiarVista(grupos[btn.dataset.grupo][0].id);
      });
    });

    (async function inicio() {
      if (!tripId) { window.location.href = "index.html"; return; }
      sesionActual = await requerirSesion();
      if (!sesionActual) return;

      // Si hoy cae dentro de las fechas del viaje, arrancamos en "En el
      // viaje" → Agenda (referencia rápida del día); si no, en
      // "Planeación" → Info como siempre.
      let vistaInicial = "info";
      try {
        const snap = await db.ref(`viajes/${tripId}/info`).get();
        const info = snap.val();
        if (info && info.fechaInicio && info.fechaFin) {
          const hoy = fechaISO(new Date().toISOString(), info.zonaOrigen || "America/Mexico_City");
          if (hoy >= info.fechaInicio && hoy <= info.fechaFin) vistaInicial = "agenda";
        }
      } catch (e) { /* si falla la lectura, cae al default "info" */ }

      await cambiarVista(vistaInicial);
    })();
  </script>
</body>
</html>
